disallowed-types = [
  { path = "std::collections::HashMap", reason = "iteration order is random per process; use BTreeMap or an indexed Vec" },
  { path = "std::collections::HashSet", reason = "iteration order is random per process; use BTreeSet or a bitset" },
  { path = "std::time::Instant", reason = "the engine never reads the wall clock" },
  { path = "std::time::SystemTime", reason = "the engine never reads the wall clock" },
  { path = "core::cell::Cell", reason = "no state outside columns: callbacks take &self" },
  { path = "core::cell::RefCell", reason = "no state outside columns: callbacks take &self" },
  { path = "core::cell::OnceCell", reason = "no state outside columns: callbacks take &self" },
  { path = "core::cell::UnsafeCell", reason = "no state outside columns: callbacks take &self" },
  { path = "core::cell::LazyCell", reason = "no state outside columns: callbacks take &self" },
  { path = "std::sync::Mutex", reason = "no state outside columns: callbacks take &self" },
  { path = "std::sync::RwLock", reason = "no state outside columns: callbacks take &self" },
  { path = "core::sync::atomic::AtomicBool", reason = "no state outside columns: callbacks take &self" },
  { path = "core::sync::atomic::AtomicU8", reason = "no state outside columns: callbacks take &self" },
  { path = "core::sync::atomic::AtomicU16", reason = "no state outside columns: callbacks take &self" },
  { path = "core::sync::atomic::AtomicU32", reason = "no state outside columns: callbacks take &self" },
  { path = "core::sync::atomic::AtomicU64", reason = "no state outside columns: callbacks take &self" },
  { path = "core::sync::atomic::AtomicUsize", reason = "no state outside columns: callbacks take &self" },
  { path = "core::sync::atomic::AtomicI8", reason = "no state outside columns: callbacks take &self" },
  { path = "core::sync::atomic::AtomicI16", reason = "no state outside columns: callbacks take &self" },
  { path = "core::sync::atomic::AtomicI32", reason = "no state outside columns: callbacks take &self" },
  { path = "core::sync::atomic::AtomicI64", reason = "no state outside columns: callbacks take &self" },
  { path = "core::sync::atomic::AtomicIsize", reason = "no state outside columns: callbacks take &self" },
  { path = "core::sync::atomic::AtomicPtr", reason = "no state outside columns: callbacks take &self" },
]
disallowed-methods = [
  { path = "std::thread::spawn", reason = "the host owns threads; the engine stays a pure function of seed and inputs" },
  { path = "std::env::var", reason = "the engine reads no environment; pass values through config" },
]
