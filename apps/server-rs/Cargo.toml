[workspace]
members = [
  "crates/sim/ecs",
  "crates/sim/engine",
  "crates/sim/random",
  "crates/host/server",
  "crates/host/tools/ecs-bench",
  "crates/host/tools/sim-cli",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.96"
publish = false

[workspace.dependencies]
korr-ecs = { path = "crates/sim/ecs" }
korr-engine = { path = "crates/sim/engine" }
korr-random = { path = "crates/sim/random" }
bevy_ecs = { version = "0.20.0", default-features = false, features = ["std"] }
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
hecs = "0.11.2"
thiserror = { version = "2.0.21", default-features = false }

[profile.release]
lto = true
codegen-units = 1

[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"
unused_qualifications = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"
print_stdout = "warn"
print_stderr = "warn"
allow_attributes_without_reason = "warn"
